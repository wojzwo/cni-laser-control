[project]
name = "cni-laser-control"
version = "0.1.0"
description = "Unofficial Python library and RS-232 CLI for CNI laser controllers"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Wojciech Zwolinski", email = "34139138+wojzwo@users.noreply.github.com" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cni", "laser", "rs232", "serial", "instrument-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["click>=8.1,<9", "pyserial>=3.5,<4", "pydantic>=2.10,<3"]

[project.scripts]
cni-laser = "cni_laser.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9,<10",
    "ruff>=0.16,<1",
    "types-pyserial>=3.5,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/cni_laser"]

[tool.ruff]
line-length = 100
target-version = "py311"
